name: Refresh Shadowrocket derived config

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test transformer
        run: python3 -m unittest discover -s tests -v
      - name: Download Johnshall configuration
        run: >-
          curl --fail --location --retry 3
          https://raw.githubusercontent.com/Johnshall/Shadowrocket-ADBlock-Rules-Forever/release/sr_top500_whitelist.conf
          --output /tmp/upstream.conf
      - name: Build derived configuration
        run: python3 scripts/build_shadowrocket_config.py /tmp/upstream.conf published/shadowrocket-custom.conf
      - name: Commit refreshed configuration when changed
        run: |
          git add published/shadowrocket-custom.conf
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh Shadowrocket derived config"
          git push
